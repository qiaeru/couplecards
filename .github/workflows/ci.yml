name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same jobs before it publishes an image.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --build-arg VERSION=ci --build-arg REVISION=${{ github.sha }} -t couplecards:ci .

      # Boots the image with a fast health-check interval so the Dockerfile's
      # own HEALTHCHECK probe decides: a broken start, a missing file or a
      # probe that can no longer reach /api/health fails here, not at release.
      - name: Boot the image until it reports healthy
        run: |
          docker run -d --name smoke --health-interval=2s \
            -e SESSION_SECRET="$(openssl rand -base64 48)" couplecards:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then break; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      # The root package.json holds two kinds of devDependencies: the libraries
      # bundled into public/vendor/ and shipped to browsers, and the local
      # tooling (ESLint, Prettier). Scanning both is deliberate: it is one
      # allowlist to maintain instead of two, and the tooling is small.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Check root dependency licenses
        run: npx --yes license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;OFL-1.1;CC0-1.0;Unlicense;0BSD;BlueOak-1.0.0' --excludePrivatePackages

      - name: Check server dependency licenses
        working-directory: server
        run: |
          npm install --omit=dev --no-audit --no-fund
          npx --yes license-checker --production --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;OFL-1.1;CC0-1.0;Unlicense;0BSD;BlueOak-1.0.0' --excludePrivatePackages

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-sw-version needs the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Repo consistency
        run: npm run check:repo

      - name: Tests
        run: npm test

      # Any change to a precached asset must move the service worker's VERSION
      # or clients keep serving the old shell from cache. Work lands on main
      # directly, so a push is compared with the tip it replaced. A tag push
      # has no previous tip (all zeros) and is skipped.
      - name: Service worker cache version
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          node scripts/check-sw-version.mjs "$BASE"
