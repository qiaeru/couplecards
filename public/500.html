<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a0f35">
  <title>CoupleCards — Server error</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <main class="error-page">
    <h1 class="title" data-i18n="errors.page.500.title">Oops, something went wrong</h1>
    <p data-i18n="errors.page.500.body"></p>
    <button type="button" class="btn btn-primary" id="reload-btn" data-i18n="common.reload">Reload</button>
  </main>
  <script type="module">
    // SPDX-License-Identifier: MIT
    import { initI18n, applyI18n } from '/js/core/i18n.js';
    initI18n().then(() => applyI18n(document)).catch(() => {});
    document.getElementById('reload-btn').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
