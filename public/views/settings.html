<header class="app-header">
  <button class="icon-btn" id="btn-back-home" data-i18n-attr="aria-label:common.back" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 class="title" data-i18n="settings.title">Settings</h1>
  <span></span>
</header>
<div class="settings">
  <div class="setting-row" id="install-row" hidden>
    <label for="install-btn" data-i18n="settings.install">Install the app</label>
    <button class="btn btn-sm btn-primary" id="install-btn" type="button" data-i18n="settings.install.action">Install</button>
  </div>
  <div class="setting-row">
    <label for="setting-language" data-i18n="settings.language">Language</label>
    <select id="setting-language" class="setting-select"></select>
  </div>
  <div class="setting-row">
    <label for="setting-sounds" data-i18n="settings.sounds">Sound effects</label>
    <span class="switch">
      <input type="checkbox" id="setting-sounds">
      <span class="slider"></span>
    </span>
  </div>
  <div class="setting-row">
    <label for="setting-vibrations" data-i18n="settings.vibrations">Vibrations</label>
    <span class="switch">
      <input type="checkbox" id="setting-vibrations">
      <span class="slider"></span>
    </span>
  </div>
  <div class="setting-row">
    <label for="btn-change-password" data-i18n="settings.changePassword">Change my password</label>
    <button class="btn btn-sm" id="btn-change-password" type="button" data-i18n="common.edit">Edit</button>
  </div>
  <div class="setting-row" id="reset-data-row">
    <label for="btn-reset-data" data-i18n="settings.resetData">Reset my data</label>
    <button class="btn btn-sm btn-danger-outline" id="btn-reset-data" type="button" data-i18n="settings.resetData.action">Reset</button>
  </div>
  <div class="setting-row">
    <label for="btn-logout" data-i18n="settings.logout">Log out</label>
    <button class="btn btn-sm" id="btn-logout" type="button" data-i18n="settings.logout.action">Log out</button>
  </div>
</div>
