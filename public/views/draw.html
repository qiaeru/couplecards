<div id="screen-draw" class="screen screen-draw">
  <div class="draw-title" aria-hidden="true">
    <img class="title-icon" src="/icons/icon.svg" alt="" draggable="false">
    <span data-i18n="draw.title">Couplecards</span>
  </div>
  <div class="draw-stage" id="draw-stage">
    <div class="bg-glow" id="bg-glow"></div>
    <div class="ripples" id="ripples"></div>
    <div class="particles" id="particles"></div>
    <div class="burst" id="burst"></div>
    <div class="hearts" id="hearts"></div>
    <div class="card-tilt" id="card-tilt">
      <div class="swipe-label swipe-label-ban" aria-hidden="true" data-i18n="draw.swipe.ban">Ban</div>
      <div class="swipe-label swipe-label-return" aria-hidden="true" data-i18n="draw.swipe.return">Return to the pile</div>
      <div class="card-flip" id="card-flip">
        <div class="card-face card-back">
          <div class="card-back-frame">
            <div class="card-back-crest"><img class="heart-icon" src="/icons/heart-gold.svg" alt="" draggable="false"></div>
          </div>
        </div>
        <div class="card-face card-front">
          <div class="foil-sparkles" aria-hidden="true">
            <span class="foil-sparkle"></span>
            <span class="foil-sparkle"></span>
            <span class="foil-sparkle"></span>
            <span class="foil-sparkle"></span>
            <span class="foil-sparkle"></span>
            <span class="foil-sparkle"></span>
          </div>
          <div class="card-frame">
            <div class="card-pile-label" id="card-pile-label"></div>
            <div class="card-art"><span class="card-art-emoji" id="card-emoji"></span></div>
            <h1 class="card-title" id="card-title"></h1>
            <div class="card-divider" aria-hidden="true">
              <span class="card-divider-ornament"><img class="heart-icon" src="/icons/heart-gold.svg" alt="" draggable="false"></span>
            </div>
            <p class="card-description" id="card-description"></p>
            <div class="card-footer-mark" aria-hidden="true">·  ·  ·</div>
          </div>
          <div class="holo holo-rainbow"></div>
          <div class="holo holo-glare"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="draw-actions" id="draw-actions" hidden>
    <button class="btn btn-md btn-danger" id="action-ban" aria-keyshortcuts="ArrowLeft" data-i18n="draw.action.ban">Ban</button>
    <button class="btn btn-md btn-success" id="action-return" aria-keyshortcuts="ArrowRight" data-i18n="draw.action.return">Return to the pile</button>
    <button class="btn btn-md btn-ghost" id="action-redraw" data-i18n="draw.action.redraw">Draw another from the same pile</button>
  </div>
  <div class="draw-actions preview-actions" id="preview-actions" hidden>
    <button class="btn btn-md btn-danger" id="preview-action-ban" data-i18n="collection.action.ban" type="button">Ban</button>
    <button class="btn btn-md btn-success" id="preview-action-unban" data-i18n="collection.action.unban" type="button" hidden>Restore</button>
    <button class="btn btn-md btn-primary" id="action-close" data-i18n="draw.action.close" type="button">Close preview</button>
  </div>
  <div id="card-announce" class="sr-only" role="status" aria-live="polite"></div>
</div>
