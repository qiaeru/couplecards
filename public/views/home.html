<header class="app-header app-header-home">
  <h1 class="title">
    <img class="title-icon" src="/icons/icon.svg" alt="" aria-hidden="true" draggable="false">
    <span data-i18n="app.name">CoupleCards</span>
  </h1>
</header>

<div class="piles">
  <button class="pile pile-home" data-pile="home" data-i18n-attr="aria-label:home.pile.home.aria">
    <span class="stack-card stack-card-back stack-card-3" aria-hidden="true"></span>
    <span class="stack-card stack-card-back stack-card-2" aria-hidden="true"></span>
    <span class="stack-card stack-card-top">
      <span class="pile-emoji"><img class="emoji" src="/icons/emoji/house.svg" alt="" draggable="false"></span>
      <span class="pile-name" data-i18n="piles.home.label">Home</span>
      <span class="pile-count" id="count-home">—</span>
      <span class="pile-low-hint" id="low-home" data-i18n="home.pile.lowHint" hidden>Almost empty</span>
    </span>
  </button>
  <button class="pile pile-outdoor" data-pile="outdoor" data-i18n-attr="aria-label:home.pile.outdoor.aria">
    <span class="stack-card stack-card-back stack-card-3" aria-hidden="true"></span>
    <span class="stack-card stack-card-back stack-card-2" aria-hidden="true"></span>
    <span class="stack-card stack-card-top">
      <span class="pile-emoji"><img class="emoji" src="/icons/emoji/city.svg" alt="" draggable="false"></span>
      <span class="pile-name" data-i18n="piles.outdoor.label">Outdoor</span>
      <span class="pile-count" id="count-outdoor">—</span>
      <span class="pile-low-hint" id="low-outdoor" data-i18n="home.pile.lowHint" hidden>Almost empty</span>
    </span>
  </button>
</div>
