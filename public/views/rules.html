<header class="app-header">
  <button class="icon-btn" id="btn-back-home" data-i18n-attr="aria-label:common.back" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h2 class="title" data-i18n="rules.title">Rules</h2>
  <span></span>
</header>

<article class="manual">
  <p data-i18n="rules.intro"></p>
  <ul class="manual-piles">
    <li>
      <span class="pile-badge home" data-i18n="piles.home.label">Home</span>
      <span data-i18n="rules.home.text"></span>
    </li>
    <li>
      <span class="pile-badge outdoor" data-i18n="piles.outdoor.label">Outdoor</span>
      <span data-i18n="rules.outdoor.text"></span>
    </li>
  </ul>

  <div class="manual-divider" aria-hidden="true">
    <span class="manual-divider-rule"></span>
    <img class="manual-divider-heart" src="/icons/heart-gold.svg" alt="" draggable="false">
    <span class="manual-divider-rule"></span>
  </div>

  <p data-i18n="rules.draw"></p>
  <p data-i18n="rules.foil"></p>

  <p data-i18n="rules.reveal"></p>
  <ul class="manual-choices">
    <li data-i18n="rules.return"></li>
    <li data-i18n="rules.ban"></li>
  </ul>

  <div class="manual-divider" aria-hidden="true">
    <span class="manual-divider-rule"></span>
    <img class="manual-divider-heart" src="/icons/heart-gold.svg" alt="" draggable="false">
    <span class="manual-divider-rule"></span>
  </div>

  <p data-i18n="rules.swipe"></p>
</article>
