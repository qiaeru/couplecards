server {
    listen 80;
    server_name _;
    # Let's Encrypt HTTP-01 challenge path (if you use certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name couplecards.example.com;

    # Replace with your actual certificate paths.
    ssl_certificate     /etc/letsencrypt/live/couplecards.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/couplecards.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Let the app manage its own CSP/Permissions-Policy headers.
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;

    location / {
        proxy_pass http://couplecards:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
