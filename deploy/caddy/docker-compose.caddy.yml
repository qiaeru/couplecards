# HTTPS deployment with Caddy (automatic Let's Encrypt).
# Run from project root: docker compose -f deploy/caddy/docker-compose.caddy.yml up -d

services:
  couplecards:
    build: ../..
    image: couplecards:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      SEED_LOCALE: ${SEED_LOCALE:-en}
    volumes:
      - ../../var:/app/var

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - couplecards

volumes:
  caddy_data:
  caddy_config:
